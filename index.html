<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards: Richelieu e Mazzarino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .perspective-1000 {
            perspective: 1000px;
        }
        .flip-card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .flip-card-inner.is-flipped {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            backface-visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            border-radius: 1.25rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .flip-card-back {
            transform: rotateY(180deg);
            background-color: #ffffff;
        }
        .curiosity-box {
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 1px dashed #cbd5e1;
            font-size: 0.9rem;
            font-style: italic;
            color: #475569;
            width: 100%;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center py-12 px-4 font-sans">

    <header class="text-center mb-10">
        <h1 class="text-4xl font-extrabold text-slate-900 mb-2">Richelieu e Mazzarino</h1>
        <p class="text-slate-500 text-lg italic">L'ascesa dell'Assolutismo in Francia</p>
    </header>

    <main class="w-full max-w-lg">
        <div id="card-container" class="relative h-96 perspective-1000">
            <!-- Card caricata via JS -->
        </div>

        <div class="flex justify-between items-center mt-10 px-2">
            <button id="prev-btn" class="bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 px-6 py-2.5 rounded-full transition shadow-sm font-medium disabled:opacity-30">
                &larr; Precedente
            </button>
            <div id="counter" class="text-slate-500 font-bold bg-white px-4 py-2 rounded-full border border-slate-100 shadow-sm">
                1 / 20
            </div>
            <button id="next-btn" class="bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 px-6 py-2.5 rounded-full transition shadow-sm font-medium disabled:opacity-30">
                Successiva &rarr;
            </button>
        </div>
    </main>

    <script>
        const cardsData = [
            {
                front: "Chi era il Cardinale Richelieu?",
                back: "Fu il Primo Ministro di Luigi XIII dal 1624. Lavorò per sottomettere i nobili e fare della Francia la prima potenza europea.",
                curiosity: "💡 Era un grande amante dei gatti: ne aveva 14 e alla sua morte lasciò loro una pensione per il cibo!",
                color: "bg-red-50"
            },
            {
                front: "Chi erano gli Intendenti?",
                back: "Funzionari di fiducia del Re inviati nelle province per controllare i nobili e riscuotere le tasse correttamente.",
                curiosity: "💡 Venivano scelti tra la borghesia perché erano più fedeli al Re rispetto ai vecchi nobili guerrieri.",
                color: "bg-blue-50"
            },
            {
                front: "L'assedio di La Rochelle",
                back: "Richelieu conquistò questa città per togliere potere militare agli Ugonotti (protestanti francesi).",
                curiosity: "💡 Per bloccare i soccorsi via mare, Richelieu fece costruire una gigantesca diga lunga 1.500 metri davanti al porto!",
                color: "bg-purple-50"
            },
            {
                front: "La Guerra dei Trent'anni",
                back: "La Francia partecipò per indebolire gli Asburgo di Spagna e d'Austria e dominare l'Europa.",
                curiosity: "💡 Nonostante fosse un cardinale cattolico, si alleò con i protestanti svedesi per ragioni politiche.",
                color: "bg-orange-50"
            },
            {
                front: "Chi era il Cardinale Mazzarino?",
                back: "Successore di Richelieu, guidò la Francia durante l'infanzia di Luigi XIV. Fu un genio della diplomazia.",
                curiosity: "💡 Era un collezionista d'arte appassionato: la sua biblioteca fu la prima aperta al pubblico in Francia.",
                color: "bg-green-50"
            },
            {
                front: "La Fronda Parlamentare",
                back: "Una rivolta dei magistrati di Parigi che si opponevano alle nuove tasse imposte da Mazzarino.",
                curiosity: "💡 Mazzarino fu odiato così tanto che i parigini scrivevano canzoni satiriche contro di lui chiamate 'Mazarinades'.",
                color: "bg-indigo-50"
            },
            {
                front: "Luigi XIII: il Re e l'uomo",
                back: "Divenne re a soli 9 anni. Era timido e spesso malato, per questo affidò il governo a Richelieu.",
                curiosity: "💡 Amava molto la musica e la danza: compose lui stesso alcuni balletti per la corte!",
                color: "bg-pink-50"
            },
            {
                front: "Anna d'Austria",
                back: "Moglie di Luigi XIII e reggente per il figlio Luigi XIV. Si fidò ciecamente di Mazzarino.",
                curiosity: "💡 Il suo nome è legato al celebre romanzo 'I Tre Moschettieri' e alla storia dei puntali di diamante.",
                color: "bg-yellow-50"
            },
            {
                front: "La Pace di Vestfalia (1648)",
                back: "Pose fine alla Guerra dei Trent'anni e confermò il successo della politica francese in Europa.",
                curiosity: "💡 Mazzarino lavorò per anni nell'ombra per dividere i nemici e ottenere condizioni di pace favorevoli.",
                color: "bg-teal-50"
            },
            {
                front: "L'Accademia di Francia",
                back: "Fondata da Richelieu nel 1635 per regolare e dare prestigio alla lingua francese.",
                curiosity: "💡 I membri dell'Accademia sono chiamati 'Gli Immortali' e ancora oggi tutelano il francese.",
                color: "bg-cyan-50"
            },
            {
                front: "Il concetto di 'Assolutismo'",
                back: "Sistema politico in cui il Re ha il potere totale, senza dover rispondere a nessuno tranne che a Dio.",
                curiosity: "💡 La parola deriva dal latino 'ab-solutus', che significa 'sciolto da ogni legame' o legge.",
                color: "bg-rose-50"
            },
            {
                front: "Jean-Baptiste Colbert",
                back: "Fu allievo di Mazzarino e divenne il ministro dell'economia di Luigi XIV, potenziando le industrie.",
                curiosity: "💡 Si dice che Mazzarino, morendo, lo presentò a Luigi XIV dicendo: 'Sire, vi lascio Colbert'.",
                color: "bg-emerald-50"
            },
            {
                front: "I Nobili di Spada",
                back: "L'antica nobiltà guerriera che Richelieu cercò di indebolire perché troppo ribelle e indipendente.",
                curiosity: "💡 Richelieu vietò i duelli tra nobili: chi combatteva rischiava la pena di morte!",
                color: "bg-amber-50"
            },
            {
                front: "La Nobiltà di Toga",
                back: "Nuovi nobili di origine borghese che compravano cariche pubbliche giurando fedeltà al Re.",
                curiosity: "💡 Si chiamavano così perché indossavano la 'toga' dei giudici, non l'armatura dei guerrieri.",
                color: "bg-slate-100"
            },
            {
                front: "Il Castello di Rueil",
                back: "La residenza preferita di Richelieu, dove riceveva ambasciatori e pianificava strategie.",
                curiosity: "💡 I suoi giardini erano così belli che servirono da ispirazione per la futura Versailles.",
                color: "bg-lime-50"
            },
            {
                front: "Il Trattato dei Pirenei (1659)",
                back: "Pace tra Francia e Spagna. Sugellò il matrimonio tra Luigi XIV e Maria Teresa di Spagna.",
                curiosity: "💡 Il matrimonio serviva a garantire che i due Paesi non si facessero più la guerra.",
                color: "bg-violet-50"
            },
            {
                front: "La Taglia (La Taille)",
                back: "La tassa più pesante pagata dai contadini francesi per finanziare le guerre dei cardinali.",
                curiosity: "💡 I nobili e il clero non pagavano questa tassa, provocando molte rivolte nelle campagne.",
                color: "bg-orange-50"
            },
            {
                front: "D'Artagnan e i Moschettieri",
                back: "Guardie reali che esistevano davvero e servivano il Re, spesso in contrasto con le guardie di Richelieu.",
                curiosity: "💡 Charles de Batz (il vero D'Artagnan) fu un soldato fedelissimo sia a Mazzarino che al Re.",
                color: "bg-blue-50"
            },
            {
                front: "L'infanzia di Luigi XIV",
                back: "Crebbe protetto da Mazzarino, imparando da lui l'arte del comando e della prudenza.",
                curiosity: "💡 Durante la Fronda dovette fuggire da Parigi di notte a soli 10 anni: segnò il suo carattere.",
                color: "bg-red-50"
            },
            {
                front: "La morte di Mazzarino",
                back: "Morì nel 1661, lasciando una Francia potente e un giovane Re pronto a governare da solo.",
                curiosity: "💡 Mazzarino era talmente ricco che la sua fortuna era quasi pari a quella dello Stato!",
                color: "bg-yellow-50"
            }
        ];

        let currentIndex = 0;
        const container = document.getElementById('card-container');
        const counter = document.getElementById('counter');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function renderCard() {
            const card = cardsData[currentIndex];
            container.innerHTML = `
                <div class="flip-card-inner w-full h-full relative" id="card-inner">
                    <div class="flip-card-front ${card.color} border border-slate-200">
                        <span class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-6 italic">Domanda</span>
                        <h2 class="text-2xl font-bold text-center text-slate-800 mb-8">${card.front}</h2>
                        <div class="text-slate-400 text-sm">Clicca per girare</div>
                    </div>
                    <div class="flip-card-back border border-blue-100">
                        <span class="text-xs font-bold uppercase tracking-widest text-blue-500 mb-4">Risposta</span>
                        <p class="text-lg text-center text-slate-700 leading-snug mb-2">${card.back}</p>
                        <div class="curiosity-box">
                            ${card.curiosity}
                        </div>
                    </div>
                </div>
            `;

            const cardInner = document.getElementById('card-inner');
            cardInner.addEventListener('click', () => {
                cardInner.classList.toggle('is-flipped');
            });

            counter.innerText = `${currentIndex + 1} / ${cardsData.length}`;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === cardsData.length - 1;
        }

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < cardsData.length - 1) {
                currentIndex++;
                renderCard();
            }
        });

        renderCard();
    </script>
</body>
</html>
